<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A modern Task Management System to organise and track your daily tasks efficiently." />
  <title>Task Manager — Stay Organised</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">✦</span>
        <h1 class="brand-title">Task Manager</h1>
      </div>
      <button id="btn-open-modal" class="btn btn-primary" aria-label="Add a new task">
        <span aria-hidden="true">＋</span> Add Task
      </button>
    </div>
  </header>

  <!-- ========== MAIN ========== -->
  <main class="main">

    <!-- Summary cards -->
    <section class="stats-grid" aria-label="Task summary">
      <div class="stat-card stat-total">
        <p class="stat-label">Total Tasks</p>
        <p class="stat-value" id="count-total">—</p>
      </div>
      <div class="stat-card stat-pending">
        <p class="stat-label">Pending</p>
        <p class="stat-value" id="count-pending">—</p>
      </div>
      <div class="stat-card stat-completed">
        <p class="stat-label">Completed</p>
        <p class="stat-value" id="count-completed">—</p>
      </div>
    </section>

    <!-- Search & filter toolbar -->
    <section class="toolbar" aria-label="Search and filter tasks">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Search tasks by title…"
          aria-label="Search tasks"
        />
      </div>
      <div class="filter-group">
        <select id="filter-status" class="filter-select" aria-label="Filter by status">
          <option value="">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
        <select id="filter-priority" class="filter-select" aria-label="Filter by priority">
          <option value="">All Priorities</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
        <button id="btn-clear-filters" class="btn btn-ghost" aria-label="Clear all filters">
          Clear
        </button>
      </div>
    </section>

    <!-- Toast notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Task list -->
    <section class="task-section" aria-label="Task list">
      <div id="task-list" class="task-list">
        <!-- Populated by script.js -->
        <div class="loading-spinner" id="loading-indicator" aria-label="Loading tasks">
          <div class="spinner"></div>
          <p>Loading tasks…</p>
        </div>
      </div>
      <p id="empty-state" class="empty-state hidden" role="status">
        <span aria-hidden="true">📋</span><br />
        No tasks found. Add your first task using the button above!
      </p>
    </section>

  </main>

  <!-- ========== MODAL ========== -->
  <div id="task-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Add New Task</h2>
        <button id="btn-close-modal" class="modal-close" aria-label="Close modal">✕</button>
      </div>

      <form id="task-form" novalidate>
        <!-- Hidden field to track edit mode -->
        <input type="hidden" id="task-id" value="" />

        <div class="form-group">
          <label for="field-title" class="form-label">
            Title <span class="required" aria-hidden="true">*</span>
          </label>
          <input
            type="text"
            id="field-title"
            class="form-input"
            placeholder="e.g. Buy groceries"
            maxlength="200"
            required
          />
          <p class="field-error hidden" id="error-title"></p>
        </div>

        <div class="form-group">
          <label for="field-description" class="form-label">Description</label>
          <textarea
            id="field-description"
            class="form-input form-textarea"
            placeholder="Optional details about this task…"
            rows="3"
          ></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="field-priority" class="form-label">
              Priority <span class="required" aria-hidden="true">*</span>
            </label>
            <select id="field-priority" class="form-input" required>
              <option value="">Select priority</option>
              <option value="High">🔴 High</option>
              <option value="Medium">🟡 Medium</option>
              <option value="Low">🟢 Low</option>
            </select>
            <p class="field-error hidden" id="error-priority"></p>
          </div>

          <div class="form-group">
            <label for="field-due-date" class="form-label">Due Date</label>
            <input
              type="date"
              id="field-due-date"
              class="form-input"
            />
          </div>
        </div>

        <!-- Status field only shown when editing -->
        <div class="form-group hidden" id="status-group">
          <label for="field-status" class="form-label">Status</label>
          <select id="field-status" class="form-input">
            <option value="Pending">Pending</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <p class="form-error hidden" id="form-error-msg"></p>

        <div class="modal-footer">
          <button type="button" id="btn-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" id="btn-submit" class="btn btn-primary">
            <span id="btn-submit-label">Create Task</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== CONFIRM DIALOG ========== -->
  <div id="confirm-dialog" class="modal-overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2 class="modal-title" id="confirm-title">Delete Task</h2>
      </div>
      <p class="confirm-message" id="confirm-message">
        Are you sure you want to delete this task? This action cannot be undone.
      </p>
      <div class="modal-footer">
        <button id="btn-confirm-cancel" class="btn btn-ghost">Cancel</button>
        <button id="btn-confirm-ok" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
